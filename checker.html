<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <!DOCTYPE html>
<html>
<head>
  <title>Fee Checker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

<div class="container bg-white p-4 rounded shadow">
  <h3>Green Valley School - Fee Checker</h3>
  <p>Total Fees: <b>80,000 UGX</b></p>

  <!-- FORM -->
  <div class="row g-2 mb-3">
    <div class="col-8">
      <input type="number" id="amountPaid" class="form-control" placeholder="Enter Amount Paid e.g 350000">
    </div>
    <div class="col-4">
      <button onclick="addEntry()" class="btn btn-primary w-100">Check & Add</button>
    </div>
  </div>

  <div id="alertBox" class="alert d-none"></div>

  <!-- TABLE -->
  <table class="table table-bordered">
    <thead class="table-light">
      <tr>
        <th>Amount paid</th>
        <th>Balance</th>
        <th>Decision message</th>
      </tr>
    </thead>
    <tbody id="feesBody"></tbody>
  </table>
</div>

<script>
let schoolFees = 80000;

function checkFee(amount){
  let balance = schoolFees - amount;
  let message;
  let alertClass;

  if(amount < schoolFees){
    message = `Balance due UGX: ${balance}`;
    alertClass = "alert-warning"; // YELLOW - underpaid
  } else if(amount == schoolFees){
    message = "Fully paid";
    alertClass = "alert-success"; // GREEN - exact
  } else {
    message = `Overpayment UGX: ${Math.abs(balance)}`;
    alertClass = "alert-info"; // BLUE - excess
  }
  return { balance, message, alertClass };
}

function addEntry() {
  let amount = Number(document.getElementById("amountPaid").value);
  
  if (!amount) {
    alert("Please enter amount");
    return;
  }

  let result = checkFee(amount);

  // --- ALERT PART ---
  let alertBox = document.getElementById("alertBox");
  alertBox.className = `alert ${result.alertClass}`; // apply color
  alertBox.textContent = result.message;
  alertBox.classList.remove("d-none");


  // Add row to table
  let row = `<tr>
    <td>${amount}</td>
    <td>${result.balance}</td>
    <td>${result.message}</td>
  </tr>`;
  
  document.getElementById("feesBody").innerHTML += row;
  
  // Also log to console
  console.log(amount + " | " + result.balance + " | " + result.message);
  
  document.getElementById("amountPaid").value = "";
}

// Add your 3 screenshot entries automatically when page loads
window.onload = function() {
  [60000, 80000, 100000].forEach(amt => {
    document.getElementById("amountPaid").value = amt;
    addEntry();
  });
}
</script>

</body>
</html>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
